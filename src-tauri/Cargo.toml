[package]
name = "e87-studio"
version = "1.0.0-beta.3"
description = "A small native Bluetooth studio for E87 badges"
authors = ["E87 Studio contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
btleplug = "0.13.5"
futures = "0.3"
jpeg-encoder = "=0.7.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
uuid = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
